<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loader Test</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/loaders.css">
<style>
  body { background: #faf8f5; margin: 0; padding: 40px; font-family: sans-serif; color: #2c3e30; }
  .row { display: flex; gap: 48px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 48px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 110px; }
  .cell label { font-size: 12px; color: #888; }
  .panel { border: 1px solid #ece8e1; border-radius: 12px; padding: 32px; width: 420px; text-align: center; background: #fff; }
</style>
</head>
<body>
  <h2>DNA 双螺旋</h2>
  <div class="row">
    <div class="bq-loader-dna" role="status" aria-label="加载中">
      <span class="bq-dna-strand bq-dna-strand--left"><i></i><i></i><i></i><i></i></span>
      <span class="bq-dna-strand bq-dna-strand--right"><i></i><i></i><i></i><i></i></span>
      <span class="bq-dna-rung"></span>
    </div>
  </div>

  <h2>原子轨道</h2>
  <div class="row">
    <div class="bq-loader-atom" role="status" aria-label="加载中">
      <span class="bq-atom-core"></span>
      <span class="bq-atom-orbit"><i></i></span>
      <span class="bq-atom-orbit bq-atom-orbit--2"><i></i></span>
      <span class="bq-atom-orbit bq-atom-orbit--3"><i></i></span>
    </div>
  </div>

  <h2>波浪 / 追点 / 双环 / 三点</h2>
  <div class="row">
    <div class="cell"><div class="bq-loader-wave"><i></i><i></i><i></i><i></i><i></i></div><label>wave</label></div>
    <div class="cell"><div class="bq-loader-chase"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><label>chase</label></div>
    <div class="cell"><div class="bq-loader-dualring"></div><label>dualring</label></div>
    <div class="cell"><div class="bq-loader-dots"><i></i><i></i><i></i></div><label>dots</label></div>
    <div class="cell"><span class="bq-loader-typing"><i></i><i></i><i></i></span><label>typing</label></div>
  </div>

  <h2>加载屏示意（模拟 exam 加载屏结构）</h2>
  <div class="panel">
    <div class="exam-loading-icon" style="display:flex;align-items:center;justify-content:center;min-height:92px;">
      <div class="bq-loader-dna" role="status" aria-label="加载中">
        <span class="bq-dna-strand bq-dna-strand--left"><i></i><i></i><i></i><i></i></span>
        <span class="bq-dna-strand bq-dna-strand--right"><i></i><i></i><i></i><i></i></span>
        <span class="bq-dna-rung"></span>
      </div>
    </div>
    <h3>正在加载题库</h3>
    <p style="color:#888;font-size:14px;">正在连接…</p>
    <div style="width:100%;height:8px;background:rgba(0,0,0,0.06);border-radius:99px;overflow:hidden;">
      <div class="bq-progress-shimmer" style="height:100%;width:62%;background:#5a7d5c;border-radius:99px;"></div>
    </div>
  </div>
</body>
</html>
