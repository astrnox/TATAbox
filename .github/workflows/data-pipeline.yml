# TATABOX — 题库数据流水线（P2 Issue #18）
# ============================================================
# 目标：题库源文件（data/questions 一题一文件）一旦变更，自动重跑生成器：
#   1. 由 per-id 题解重建 index / bank / id-all / manifest；
#   2. manifest 内写入各分片 crypto sha256（files: {path: sha256}）；
#   3. 提交并 push 重新生成的产物，保证「manifest 与实际分片哈希一致」。
#
# 历史说明：早期使用 scripts/generate-bio-shards.js 从 data/quiz_m*.json 与
# data/legacy/*.json 聚合。题库迁移到 v1.1 per-id 存储后这些源文件已不存在，
# 该生成器会因「空考点」直接 FATAL（2026-10 起因它整条流水线一直失败）。
# 现改为调用 tools/python/rebuild-bank-perid.py（仅用标准库），与本地
# `npm run` 数据维护流程、verify-bio-shards 的口径保持一致。
#
# 与 ci.yml 的分工：
#   - ci.yml  在每次 push/PR 上只读地「校验」manifest 与分片一致性；
#   - 本 workflow 负责产物的「自动生成与回写」。
#
# 防无限循环：
#   触发路径 data/** 会因「回写的产物也是 data/**」再次命中。
#   生成过程除 manifest.rev / updated_at / id-all.generated_at 外是确定性的，
#   因此本流程用固定机器人身份提交，当触发 commit 的作者是机器人时直接跳过，
#   循环在第二轮终止。
#
# 锚点安全（PR #25 教训）：
#   本流程不再改写 manifest 的 repo/git 锚点，锚点由人工/生成器维护；
#   校验步骤仍会检查锚点归属，防止 fork 锚点混入。

name: Data Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**'
      - 'tools/python/rebuild-bank-perid.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    name: auto-regenerate manifest + shards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 防循环：上一次本流程已用过机器人身份提交过，若触发 commit 的作者
      # 正是机器人，说明是「回写产物」的推送，产物已是最新，无需再生成。
      - name: Skip auto-committed runs (break the loop)
        run: |
          author="${{ github.event.head_commit.author.name }}"
          echo "trigger author = '$author'"
          if [ "$author" = "bioquest-bot" ]; then
            echo "已是机器人回写提交，跳过重新生成，避免无限循环"
            exit 0
          fi

      - name: Regenerate shards + manifest（per-id → 四件套）
        run: |
          python3 tools/python/rebuild-bank-perid.py build
          python3 tools/python/rebuild-bank-perid.py verify

      - name: Consistency smoke check (Issue #18 验收标准 2)
        # manifest 中 files:{path:sha256} 与实际分片一致性、bioID 唯一性、
        # index/bank 双向一致。
        run: node scripts/verify-bio-shards.js

      - name: CDN 锚点一致性校验（PR #25）
        # 确保 manifest 的 repo/git 指向本仓库而非 fork。
        run: node scripts/verify-manifest-anchor.js

      - name: Commit regenerated data
        run: |
          git config user.name "bioquest-bot"
          git config user.email "bioquest-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "题库产物已与生成器输出一致，无需提交"
          else
            git commit -m "chore(data): 重建题库分片与 manifest（数据流水线自动生成）"
            git push origin HEAD
            echo "已提交并推送重新生成的题库产物"
          fi