<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>401 - 未授权访问 | TATABOX</title>
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #1a1a1a;
      background-color: #faf7f2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: #1a2f1d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .header-brand {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .header-brand:hover { color: #c4956a; }
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px 40px;
    }
    .error-container {
      text-align: center;
      max-width: 560px;
      width: 100%;
      animation: fadeInUp 0.5s ease forwards;
    }
    .error-code {
      font-family: 'Noto Serif SC', serif;
      font-size: 8rem;
      font-weight: 700;
      line-height: 1;
      color: #5a7d5c;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .error-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #1a3a2a;
      margin-bottom: 12px;
    }
    .error-message {
      font-size: 1.05rem;
      color: #4a4a4a;
      margin-bottom: 40px;
      line-height: 1.7;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 0.938rem;
      font-weight: 600;
      padding: 13px 26px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background-color: #c4956a;
      color: #1a3a2a;
      text-decoration: none;
      transition: background-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
      outline: none;
      user-select: none;
    }
    .btn-primary:hover {
      box-shadow: var(--shadow-button, 0 1px 3px rgba(44, 62, 48, 0.08));
    }
    .btn-primary:active { transform: scale(0.97); }
    .btn-primary:focus-visible { box-shadow: 0 0 0 3px rgba(196, 149, 106, 0.6); }
    .footer {
      background: #1a3a2a;
      padding: 44px 0;
      color: rgba(255, 255, 255, 0.6);
    }
    .footer-content {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .footer-brand {
      font-family: 'Noto Serif SC', serif;
      font-size: 1rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 768px) {
      .header { padding: 0 12px; }
      .header-brand { font-size: 1.1rem; }
      .error-code { font-size: 5.5rem; }
      .error-title { font-size: 1.25rem; }
      .error-message { font-size: 0.95rem; }
      .footer-content { padding: 0 20px; flex-direction: column; text-align: center; }
    }
    @media (max-width: 480px) {
      .error-code { font-size: 4rem; }
      .error-title { font-size: 1.1rem; }
    }
    @media (prefers-color-scheme: dark) {
      body {
        color: #e8e6e2;
        background-color: #1a1f1c;
      }
      .error-code {
        color: #a8c9ac;
      }
      .error-title { color: #e8e6e2; }
      .error-message { color: #b0aea8; }
      .btn-primary { background-color: #d4a574; color: #1a2f1d; }
      .btn-primary:hover { box-shadow: var(--shadow-button, 0 1px 3px rgba(44, 62, 48, 0.08)); }
      .footer { background: #1a2f1d; }
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="/" class="header-brand">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="26" height="26" rx="7.6" stroke="#d4a87e" stroke-width="2.6"/>
        <path d="M16 10.2v11.8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M11.2 10.2h9.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
      TATABOX
    </a>
  </header>

  <main class="main">
    <div class="error-container">
      <div class="error-code">401</div>
      <h1 class="error-title">未授权访问</h1>
      <p class="error-message">请先登录后再访问此页面</p>
      <a href="/" class="btn-primary">返回首页</a>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <div class="footer-brand">TATABOX — 高中生物学习平台</div>
    </div>
  </footer>
</body>
</html>
